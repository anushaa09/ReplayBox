services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    command: ["npm", "start"]
    environment:
      PORT: 8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      MONGODB_URI: mongodb://mongo:27017/replaybox
      REDIS_URL: redis://redis:6379
      REPLAY_ALLOWED_HOSTS: localhost,127.0.0.1,host.docker.internal,target
    ports:
      - "8000:8000"
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      MONGODB_URI: mongodb://mongo:27017/replaybox
      REDIS_URL: redis://redis:6379
      REPLAY_ALLOWED_HOSTS: localhost,127.0.0.1,host.docker.internal,target
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  target:
    profiles: ["demo"]
    build: .
    command: ["node", "demo/target-api.js"]
    environment:
      PORT: 9000
      BUG: ${BUG:-0}
      APP_VERSION: ${APP_VERSION:-v1.0}
    ports:
      - "9000:9000"
    depends_on:
      - api

volumes:
  mongodata:
  redisdata:
